<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RESUMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #401b1b, #120808 55%, #050303);
            color: white;
        }
        .login-box {
            width: min(420px, 92%);
            padding: 35px;
            border-radius: 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(231,76,60,0.4);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }
        h1 { margin: 0 0 8px; color: #ff6f61; }
        .sub { color: #d2b6b3; margin-bottom: 25px; }
        label { display: block; margin: 14px 0 7px; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #68413d;
            border-radius: 10px;
            background: #180d0c;
            color: white;
            outline: none;
        }
        input:focus { border-color: #e74c3c; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #e74c3c;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            padding: 10px;
            border-radius: 8px;
            background: rgba(231,76,60,0.15);
            color: #ff9d94;
            margin-bottom: 15px;
        }
        .user-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #75d9bb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>RESUMind AI</h1>
        <div class="sub">Administrator Login</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label>Admin Username</label>
            <input type="text" name="username" placeholder="Enter admin username" required>

            <label>Admin Password</label>
            <input type="password" name="password" placeholder="Enter admin password" required>

            <button type="submit">Login as Admin</button>
        </form>

        <a class="user-link" href="{{ url_for('user_login') }}">← User Login</a>
    </div>
</body>
</html>
