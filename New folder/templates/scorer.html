        .container { background: rgba(11, 15, 25, 0.78); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        input[type="file"], button { width: 100%; margin-top: 15px; padding: 12px; border-radius: 8px; border: none; box-sizing: border-box; }
        input[type="file"] { color: #ccc; background: rgba(255,255,255,0.05); }
        button { background: #4ecca3; color: #0b0f19; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        button:hover { background: #3db892; }
        button:disabled { background: #666; cursor: not-allowed; }
        .results-card { display: none; margin-top: 25px; background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 10px; border: 1px solid rgba(78, 204, 163, 0.2); }

        .score-box h3 { margin: 0; font-size: 3rem; color: #4ecca3; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; margin-top: 8px; }
        .badge-high { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .badge-medium { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid #f1c40f; }
        .badge-low { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .check-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.88rem; }
        .link-section { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); }
        .direct-link-btn { display: inline-block; margin-top: 10px; background: #3498db; color: white; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }
        a.home-link { color: #4ecca3; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; }

<body>
    <div class="container">
        <h2>ATS Compatibility & Score</h2>
        <input type="file" id="resumeFile" accept=".pdf">
        <button id="scanBtn" onclick="processATS()">Calculate ATS Score</button>

        <div id="resultsCard" class="results-card">
            <div class="score-box">
                <h3 id="overallScore">0%</h3>
                <p style="margin:0; color:#aaa; font-size:0.85rem;">Overall ATS Match Score</p>
                <span id="compatBadge" class="badge">Match Level</span>
            </div>

            <h4 style="color: #4ecca3; margin-bottom: 10px;">🔍 Detailed Audit</h4>
            <div id="checksList"></div>

            <div class="link-section">
                <p style="color:#aaa; font-size:0.85rem; margin-bottom: 8px;">Uploaded Resume Document:</p>
                <a id="directResumeLink" href="#" target="_blank" class="direct-link-btn">📄 Open Uploaded Resume</a>
            </div>
        </div>
        <a href="/" class="home-link">← Back to Home</a>
    </div>

    <script>
        async function processATS() {
            const fileInput = document.getElementById('resumeFile');
            const scanBtn = document.getElementById('scanBtn');
            const resultsCard = document.getElementById('resultsCard');

            if (!fileInput.files[0]) {
                alert("Please select a PDF file first!");
                return;
            }

            scanBtn.innerText = "Analyzing Resume Score...";
            scanBtn.disabled = true;

            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);

            try {
                const response = await fetch('/get_score', { 
                    method: 'POST', 
                    body: formData 
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('overallScore').innerText = data.overall_score + "%";
                    const badge = document.getElementById('compatBadge');
                    badge.innerText = data.compatibility_level;
                    badge.className = "badge " + (data.overall_score >= 75 ? "badge-high" : (data.overall_score >= 45 ? "badge-medium" : "badge-low"));

                    let checksHTML = "";
                    data.ats_checks.forEach(c => {
                        checksHTML += `<div class="check-item">
                            <div>
                                <strong>${c.name}</strong><br>
                                <small style="color:#aaa;">${c.detail}</small>
                            </div>
                            <span style="color:${c.status === 'passed' ? '#2ecc71':'#f1c40f'}; font-weight:bold;">
                                ${c.status === 'passed' ? '✔ Passed':'⚠️ Check'}
                            </span>
                        </div>`;
                    });
                    
                    document.getElementById('checksList').innerHTML = checksHTML;
                    document.getElementById('directResumeLink').href = data.direct_link;

                    resultsCard.style.display = 'block';
                } else {
                    alert(data.message || "Error scoring resume.");
                }
            } catch (error) {
                alert("Server Connection Error!");
            } finally {
                scanBtn.innerText = "Calculate ATS Score";
                scanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
