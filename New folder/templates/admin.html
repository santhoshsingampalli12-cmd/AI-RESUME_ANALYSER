<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | RESUMind</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0b0f19; font-family: 'Poppins', sans-serif; color: white; padding: 40px; }
        h1 { color: #4ecca3; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .metric { font-size: 2rem; color: #4ecca3; font-weight: bold; }
        ul { list-style: none; padding: 0; }
        li { background: rgba(0,0,0,0.3); padding: 10px; margin-bottom: 5px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Administrator Dashboard</h1>
    <div class="card">
        <h3>Total Resumes Analyzed</h3>
        <p class="metric">{{ stats.total_scans }}</p>
    </div>
    <div class="card">
        <h3>User Feedbacks</h3>
        <ul>
            {% for fb in stats.feedbacks %}
                <li>{{ fb }}</li>
            {% else %}
                <li>No feedback submitted yet.</li>
            {% endfor %}
        </ul>
    </div>
    <a href="/" style="color: #4ecca3;">← Back to Home</a>
</body>
</html>
