            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; width: 500px; }
        h2 { color: #4ecca3; text-align: center; margin-top: 0; }
        input[type="file"], button { width: 100%; margin-top: 15px; padding: 12px; border-radius: 8px; border: none; box-sizing: border-box; }
        input[type="file"] { color: #ccc; background: rgba(255,255,255,0.05); }
        button { background: #4ecca3; color: #0b0f19; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .results-card { display: none; margin-top: 25px; background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 10px; border: 1px solid rgba(78, 204, 163, 0.2); }
        .skill-tag { display: inline-block; background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; margin: 3px; font-weight: bold; }
        ul { padding-left: 20px; font-size: 0.88rem; color: #ddd; }
        li { margin-bottom: 6px; }
        a { color: #4ecca3; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Skill Gap & Suggestions</h2>
        <input type="file" id="resumeFile" accept=".pdf">
        <button id="btn" onclick="checkSkillGap()">Analyze Skill Gap</button>

        <div id="resultsCard" class="results-card">
            <h4 style="color: #e74c3c; margin-top: 0;">⚠️ Missing Skills (Skill Gap)</h4>
            <div id="skillsDiv"></div>

            <h4 style="color: #4ecca3; margin-top: 20px;">💡 Suggestions for Improvement</h4>
            <ul id="sugList"></ul>
        </div>
        <a href="/">← Back to Home</a>
    </div>

    <script>
        async function checkSkillGap() {
            const fileInput = document.getElementById('resumeFile');
            if (!fileInput.files[0]) return alert("Select a PDF file!");

            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);

            const res = await fetch('/get_skill_gap', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.status === 'success') {
                const skillsDiv = document.getElementById('skillsDiv');
                skillsDiv.innerHTML = "";
                if (data.missing_skills.length > 0) {
                    data.missing_skills.forEach(s => skillsDiv.innerHTML += `<span class="skill-tag">${s.toUpperCase()}</span>`);
                } else {
                    skillsDiv.innerHTML = "<p style='color:#2ecc71; font-size:0.85rem;'>No skill gaps found!</p>";
                }

                const sugList = document.getElementById('sugList');
                sugList.innerHTML = "";
                data.suggestions.forEach(s => sugList.innerHTML += `<li>${s}</li>`);

                document.getElementById('resultsCard').style.display = 'block';
            }
        }
    </script>
</body>
</html>
