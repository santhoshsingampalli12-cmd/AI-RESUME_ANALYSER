<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RESUMind AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0f19;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-container {
            width: 420px;
            padding: 35px;
            background: #111827;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color: #4ecca3;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4ecca3;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 20px;
        }

        .eye-btn:hover {
            color: #4ecca3;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4ecca3;
            color: #0b0f19;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .error {
            background: #3b1515;
            color: #ff7777;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .login-link a {
            color: #4ecca3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <h1>RESUMind AI</h1>
    <p class="subtitle">Create your account</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label>Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword()"
                    id="eyeButton"
                >👁</button>
            </div>
        </div>

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{{ url_for('user_login') }}">Login</a>
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eyeButton = document.getElementById("eyeButton");

    if (password.type === "password") {
        password.type = "text";
        eyeButton.textContent = "🙈";
    } else {
        password.type = "password";
        eyeButton.textContent = "👁";
    }
}
</script>

</body>
</html>
