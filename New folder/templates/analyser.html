        .container { background: rgba(10, 16, 28, 0.72); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 30px; border-radius: 15px; width: 550px; }

<body>
    <div class="container">
        <h2>Job Matching Analyser</h2>
        <input type="file" id="resumeFile" accept=".pdf">
        <button id="analyzeBtn" onclick="runAnalysis()">Match Job Profiles</button>

        <div id="resultsCard" class="results-card">
            <h4 style="color: #4ecca3; margin-top: 0;">🎯 Top Suitable Roles & Match %:</h4>
            <div id="jobList"></div>
        </div>
        <a href="/">← Back to Home</a>
    </div>

    <script>
        async function runAnalysis() {
            const fileInput = document.getElementById('resumeFile');
            const btn = document.getElementById('analyzeBtn');
            const resultsCard = document.getElementById('resultsCard');

            if (!fileInput.files[0]) {
                alert("Select a PDF file!");
                return;
            }

            btn.innerText = "Analyzing Resume Skills...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.status === 'success') {

                    // Sort match percentage from highest to lowest
                    data.jobs.sort((a, b) => {
                        const matchA = parseFloat(String(a.match).replace('%', ''));
                        const matchB = parseFloat(String(b.match).replace('%', ''));
                        return matchB - matchA;
                    });

                    let html = "";

                    data.jobs.forEach(item => {
                        let matchedText =
                            item.matched_skills && item.matched_skills.length > 0
                                ? item.matched_skills.join(", ")
                                : "No skills matched";

                        html += `<div class="job-item">
                                    <div>
                                        <strong>${item.job}</strong><br>
                                        <small style="color:#aaa;">Matched: ${matchedText}</small>
                                    </div>
                                    <span class="match-badge">${item.match}</span>
                                 </div>`;
                    });

                    document.getElementById('jobList').innerHTML = html;
                    resultsCard.style.display = 'block';

                } else {
                    alert(data.message || "Error analyzing resume.");
                }
            } catch (err) {
                alert("Server Connection Error!");
            } finally {
                btn.innerText = "Match Job Profiles";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>s
